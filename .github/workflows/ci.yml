name: verify

on:
  push:
  pull_request:

jobs:
  python:
    name: CLI verifier (V1-V11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install jsonschema cryptography
      - run: python verify_review_brain.py examples/case-demo

  browser:
    name: JS kernel (16 checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node verifier/test_verifier.js
