name: verify

on:
  push:
  pull_request:

jobs:
  python:
    name: CLI verifier (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      # 双保险：即使代码里的 reconfigure 失效，Windows runner 也按 UTF-8 跑
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install jsonschema cryptography
      - run: python verify_review_brain.py examples/case-demo

  browser:
    name: JS kernel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node verifier/test_verifier.js
